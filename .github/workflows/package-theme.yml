name: Package theme

on:
  workflow_call:
    inputs:
      version:
        description: Git release tag; nearest reachable tag or temporary 1.0.0 fallback
        required: false
        default: ""
        type: string
    outputs:
      artifact-name:
        description: Name of the uploaded theme artifact
        value: ${{ jobs.package.outputs.artifact-name }}
      zip-name:
        description: Filename of the packaged theme ZIP
        value: ${{ jobs.package.outputs.zip-name }}

permissions: {}

jobs:
  package:
    name: Build theme ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.archive.outputs.artifact-name }}
      zip-name: ${{ steps.archive.outputs.zip-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare theme package
        id: archive
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $version = $env:PACKAGE_VERSION -replace '^[vV]', ''
          if (-not $version) {
            try {
              $version = git -C $env:GITHUB_WORKSPACE describe --tags --abbrev=0 `
                --match '[vV][0-9]*.[0-9]*.[0-9]*' --match '[0-9]*.[0-9]*.[0-9]*' 2>$null
              if ($LASTEXITCODE -ne 0) {
                throw 'Git tag lookup failed.'
              }
            }
            catch {
              # TODO: Remove this fallback once Git version tags are in use.
              $version = '1.0.0'
            }
            $version = $version -replace '^[vV]', ''
          }
          if ($version -notmatch '^[A-Za-z0-9][A-Za-z0-9._+-]*$') {
            throw "Invalid package version: $version"
          }

          $commitCount = git -C $env:GITHUB_WORKSPACE rev-list --count HEAD
          if ($LASTEXITCODE -ne 0 -or $commitCount -notmatch '^\d+$') {
            throw 'Could not determine the Git commit count.'
          }
          $changes = @(git -C $env:GITHUB_WORKSPACE status --porcelain=v1)
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not determine whether the checkout is dirty.'
          }
          $artifactName = "scouting-nederland-wordpress-theme-$version.$commitCount"
          $zipName = "$artifactName.zip"

          $stagingRoot = Join-Path $env:RUNNER_TEMP 'theme-package'
          $themeDirectory = Join-Path $stagingRoot 'scouting-nederland-wordpress-theme'

          if (Test-Path -LiteralPath $stagingRoot) {
            Remove-Item -LiteralPath $stagingRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $themeDirectory | Out-Null

          $rootFiles = @('style.css', 'theme.json', 'readme.txt', 'screenshot.png', 'LICENSE')
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -File |
            Where-Object { $_.Extension -eq '.php' -or $_.Name -in $rootFiles } |
            Copy-Item -Destination $themeDirectory

          foreach ($directory in @('assets', 'inc', 'languages', 'parts')) {
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $directory) `
              -Destination $themeDirectory -Recurse
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "package-path=$stagingRoot"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip-name=$zipName"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "artifact-name=$artifactName"

      - name: Upload theme ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.archive.outputs.artifact-name }}
          path: ${{ steps.archive.outputs.package-path }}
          if-no-files-found: error
