name: Package theme

on:
  workflow_call:
    inputs:
      version:
        description: Optional Git release tag; must match the theme version in style.css
        required: false
        default: ""
        type: string
    outputs:
      zip-name:
        description: Filename and artifact name of the packaged theme ZIP
        value: ${{ jobs.package.outputs.zip-name }}

permissions: {}

jobs:
  package:
    name: Build theme ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      zip-name: ${{ steps.archive.outputs.zip-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare theme package
        id: archive
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $commitCount = git -C $env:GITHUB_WORKSPACE rev-list --count HEAD
          if ($LASTEXITCODE -ne 0 -or $commitCount -notmatch '^\d+$') {
            throw 'Could not determine the Git commit count.'
          }

          $zipPath = & (Join-Path $env:GITHUB_WORKSPACE 'scripts\build-zip.ps1') `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'theme-package') `
            -ReleaseTag $env:PACKAGE_VERSION -CommitCount $commitCount
          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip-path=$zipPath"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip-name=$(Split-Path -Leaf $zipPath)"

      - name: Upload theme ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.archive.outputs.zip-path }}
          archive: false
          if-no-files-found: error
